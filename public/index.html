<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Solo por invitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="club.css">
</head>
<body>
  <main class="wrap">
    <!-- 1. Puerta: pedir el código -->
    <section class="column fade-in" id="gate" hidden>
      <p class="kicker">Acceso privado</p>
      <h1 class="logo" data-club-name></h1>
      <p class="lead"><span id="gateLine1"></span><span id="gateLine2"></span></p>
      <form id="codeForm" autocomplete="off">
        <label class="lbl" for="code">Código</label>
        <div class="code-row">
          <input class="code-input" id="code" name="code" placeholder="••••••" autocapitalize="characters" spellcheck="false" maxlength="30" required>
          <button class="go" type="submit" id="enterBtn" aria-label="Pasar">→</button>
        </div>
        <p class="message" id="codeMessage" role="alert" style="margin-top:10px"></p>
      </form>
      <div class="gate-links">
        <button class="link-btn" id="sinCodigo" type="button" hidden>No tengo código</button>
        <button class="link-btn" id="verMisPedidos" type="button" hidden>Ver mis pedidos</button>
      </div>
      <p class="fineprint"><span id="footer"></span><span id="ageTag"></span></p>
    </section>

    <!-- 2. Registro obligatorio -->
    <section class="column fade-in" id="registro" hidden>
      <p class="kicker">Registro</p>
      <h1 class="logo logo-sm" data-club-name></h1>
      <div id="registroEvento"></div>
      <form id="registroForm" class="form-grid" novalidate>
        <div class="picker" id="eventPicker" hidden></div>

        <p class="hello" id="clienteConocido" hidden>
          Registrado/a como <b id="clienteNombre"></b>.
          <button class="link-btn" id="noSoyYo" type="button">No soy yo</button>
        </p>

        <div class="form-grid" id="datosNuevos">
          <div>
            <label class="lbl" for="nombre">Nombre y apellido</label>
            <input class="field" id="nombre" autocomplete="name" maxlength="80" required aria-describedby="error-nombre">
            <p class="field-error" id="error-nombre"></p>
          </div>
          <div>
            <label class="lbl" for="instagram">Instagram</label>
            <input class="field" id="instagram" placeholder="@usuario" autocapitalize="none" spellcheck="false" maxlength="60" required aria-describedby="error-instagram">
            <p class="field-error" id="error-instagram"></p>
          </div>
          <div class="row2">
            <div>
              <label class="lbl" for="cumpleanos">Cumpleaños</label>
              <input class="field" id="cumpleanos" type="date" required aria-describedby="error-cumpleanos">
              <p class="field-error" id="error-cumpleanos"></p>
            </div>
            <div>
              <label class="lbl" for="telefono">Teléfono</label>
              <input class="field" id="telefono" type="tel" autocomplete="tel" maxlength="24" value="+54 9 " required aria-describedby="error-telefono">
              <p class="field-error" id="error-telefono"></p>
            </div>
          </div>
          <div>
            <label class="consent">
              <input type="checkbox" id="consentimiento" aria-describedby="error-consentimiento">
              <span>Acepto que se usen mis datos como explica el aviso de privacidad.</span>
            </label>
            <button class="link-btn" id="verConsentimiento" type="button" aria-expanded="false" aria-controls="textoConsentimiento">Leer el aviso</button>
            <div class="consent-text" id="textoConsentimiento" hidden></div>
            <p class="field-error" id="error-consentimiento"></p>
          </div>
        </div>

        <button class="btn" type="submit" id="registroBtn">Registrarme</button>
        <p class="message" id="registroMessage" role="alert"></p>
      </form>
      <p class="fineprint"><span>Precios y compras, solo para registrados</span></p>
    </section>

    <!-- 3. Catálogo -->
    <section class="column fade-in" id="catalogo" hidden>
      <p class="kicker">Catálogo</p>
      <h1 class="logo logo-sm" data-club-name></h1>
      <div id="catalogoEvento"></div>
      <div class="banner" id="avisoPedidos" hidden></div>
      <div class="products" id="productos"></div>
      <div class="order-bar" id="orderBar" hidden>
        <div>
          <p class="order-count" id="orderCount"></p>
          <p class="order-total" id="orderTotal"></p>
        </div>
        <button class="btn" type="button" id="pedirBtn">Pedir</button>
      </div>
      <p class="message" id="catalogoMessage" role="alert"></p>
      <p class="note">No pagás ahora: la producción revisa cada pedido y, si lo aprueba, te habilitamos el pago.</p>
    </section>

    <!-- 4. Mis pedidos -->
    <section class="column fade-in" id="pedidos" hidden>
      <p class="kicker">Tus pedidos</p>
      <h1 class="logo logo-sm" data-club-name></h1>
      <p class="note" id="pedidosNota"></p>
      <div id="listaPedidos" class="column"></div>
      <button class="btn btn-ghost" id="otroPedido" type="button">Hacer otro pedido</button>
      <p><button class="link-btn" id="olvidarPedidos" type="button">Borrar los pedidos de este teléfono</button></p>
    </section>
  </main>

  <script src="validar.js"></script>
  <script src="common.js"></script>
  <script src="club.js"></script>
</body>
</html>
