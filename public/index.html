<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0c0e">
  <title>Solo por invitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700;800&display=swap">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="club.css">
</head>
<body>
  <main class="wrap">
    <!-- 1. Puerta: pedir el código -->
    <section class="column fade-in" id="gate" hidden>
      <p class="kicker">Acceso privado</p>
      <h1 class="logo" data-club-name></h1>
      <p class="lead"><span id="gateLine1"></span><span id="gateLine2"></span></p>
      <form id="codeForm" autocomplete="off">
        <label class="lbl" for="code">Código</label>
        <div class="code-row">
          <input class="code-input" id="code" name="code" placeholder="••••••" autocapitalize="characters" spellcheck="false" maxlength="30" required>
          <button class="go" type="submit" id="enterBtn" aria-label="Pasar">→</button>
        </div>
        <p class="message" id="codeMessage" role="alert" style="margin-top:10px"></p>
      </form>
      <p class="fineprint"><span id="footer"></span><span id="ageTag"></span></p>
    </section>

    <!-- 2. Adentro: fiesta y anotarse en lista -->
    <section class="column fade-in" id="inside" hidden>
      <p class="kicker">Estás adentro</p>
      <h1 class="logo logo-sm" data-club-name></h1>
      <div id="eventBox"></div>
      <form id="listForm" class="form-grid" novalidate>
        <div class="picker" id="eventPicker" hidden></div>
        <div>
          <label class="lbl" for="name">Nombre y apellido</label>
          <input class="field" id="name" autocomplete="name" maxlength="80" required>
        </div>
        <div class="row2">
          <div>
            <label class="lbl" for="dni">DNI</label>
            <input class="field" id="dni" inputmode="numeric" maxlength="12" required>
          </div>
          <div>
            <label class="lbl" for="birthdate">Nacimiento</label>
            <input class="field" id="birthdate" type="date" required>
          </div>
        </div>
        <div class="row2">
          <div>
            <label class="lbl" for="phone">Celular</label>
            <input class="field" id="phone" type="tel" autocomplete="tel" maxlength="30" required>
          </div>
          <div>
            <label class="lbl" for="instagram">Instagram</label>
            <input class="field" id="instagram" placeholder="@usuario" autocapitalize="none" spellcheck="false" maxlength="40">
          </div>
        </div>
        <div>
          <label class="lbl" for="guests">¿Venís con alguien?</label>
          <select class="field" id="guests">
            <option value="0">No, voy solo/a</option>
            <option value="1">Sí, +1</option>
            <option value="2">Sí, +2</option>
            <option value="3">Sí, +3</option>
          </select>
        </div>
        <button class="btn" type="submit" id="listBtn">Anotarme</button>
        <p class="message" id="listMessage" role="alert"></p>
      </form>
      <p class="fineprint"><span>La dirección aparece cuando quedás en lista</span></p>
    </section>

    <!-- 3. Pase -->
    <section class="column fade-in" id="passView" hidden>
      <p class="kicker">Tu lugar</p>
      <h1 class="logo logo-sm" data-club-name></h1>
      <div id="pass" class="column"></div>
      <p class="pass-hint">Mostrá esta pantalla y tu DNI en la puerta.</p>
      <button class="btn btn-ghost" id="addAnother" type="button">Anotar a alguien más</button>
      <p><button class="link-btn" id="forgetPass" type="button">Este pase no es mío, borrarlo</button></p>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="club.js"></script>
</body>
</html>
