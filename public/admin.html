<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de administración</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="logo" id="logo">Tienda</a>
      <span class="muted">Panel admin</span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" hidden>Salir</button>
    </div>
  </header>

  <!-- Login -->
  <div class="card login-box" id="loginBox" hidden>
    <h2 style="margin-top:0">Ingresar al panel</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
      <p class="error" id="loginError"></p>
      <button class="btn btn-block" type="submit">Ingresar</button>
    </form>
  </div>

  <div class="admin-layout" id="panel" hidden>
    <nav class="admin-nav">
      <button class="btn btn-ghost active" data-view="orders">📋 Pedidos</button>
      <button class="btn btn-ghost" data-view="products">🍕 Productos</button>
      <button class="btn btn-ghost" data-view="categories">🗂️ Categorías</button>
      <button class="btn btn-ghost" data-view="settings">⚙️ Ajustes</button>
    </nav>

    <div class="stats" id="stats"></div>

    <!-- Pedidos -->
    <section data-section="orders">
      <div class="toolbar-row">
        <select id="orderFilter" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="refreshOrders">↻ Actualizar</button>
        <label class="check" style="margin:0"><input type="checkbox" id="soundToggle" checked> Aviso sonoro de pedidos nuevos</label>
      </div>
      <div class="admin-orders" id="orders"></div>
    </section>

    <!-- Productos -->
    <section data-section="products" hidden>
      <div class="toolbar-row">
        <button class="btn" id="newProduct">+ Nuevo producto</button>
        <input type="search" id="productSearch" placeholder="Buscar…" style="max-width:260px">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th></th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Estado</th><th></th></tr></thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </section>

    <!-- Categorías -->
    <section data-section="categories" hidden>
      <form class="toolbar-row" id="categoryForm">
        <input type="text" id="categoryName" placeholder="Nueva categoría" required maxlength="60" style="max-width:280px">
        <button class="btn" type="submit">Agregar</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Orden</th><th>Nombre</th><th>Productos</th><th></th></tr></thead>
          <tbody id="categoryRows"></tbody>
        </table>
      </div>
    </section>

    <!-- Ajustes -->
    <section data-section="settings" hidden>
      <form class="card" id="settingsForm" style="max-width:640px">
        <label class="check"><input type="checkbox" name="isOpen"> Tienda abierta (recibiendo pedidos)</label>
        <label for="sName">Nombre de la tienda</label>
        <input type="text" id="sName" name="storeName" maxlength="60">
        <label for="sTagline">Frase de portada</label>
        <input type="text" id="sTagline" name="tagline" maxlength="120">
        <div class="row">
          <div>
            <label for="sWa">WhatsApp (con código de país)</label>
            <input type="tel" id="sWa" name="whatsapp" placeholder="5215512345678">
          </div>
          <div>
            <label for="sCurrency">Moneda (código)</label>
            <input type="text" id="sCurrency" name="currency" maxlength="3" placeholder="MXN, ARS, COP…">
          </div>
        </div>
        <div class="row">
          <div>
            <label for="sFee">Costo de envío</label>
            <input type="number" id="sFee" name="deliveryFee" min="0" step="0.01">
          </div>
          <div>
            <label for="sMin">Pedido mínimo</label>
            <input type="number" id="sMin" name="minOrder" min="0" step="0.01">
          </div>
        </div>
        <label for="sHours">Horario</label>
        <input type="text" id="sHours" name="hours" maxlength="120">
        <label for="sAddress">Dirección del local</label>
        <input type="text" id="sAddress" name="address" maxlength="200">
        <label for="sTransfer">Datos para transferencia</label>
        <textarea id="sTransfer" name="transferInfo" maxlength="300" placeholder="Banco, CLABE / CBU / alias, titular"></textarea>
        <label for="sColor">Color principal</label>
        <input type="color" id="sColor" name="primaryColor">
        <p class="muted" id="mpStatus"></p>
        <button class="btn" type="submit" style="margin-top:12px">Guardar ajustes</button>
      </form>
    </section>
  </div>

  <!-- Editor de producto -->
  <div class="overlay" id="productModal" hidden>
    <div class="modal">
      <div class="modal-head"><h2 id="productTitle">Producto</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
      <form class="modal-body" id="productForm">
        <label for="pName">Nombre</label>
        <input type="text" id="pName" required maxlength="100">
        <label for="pDesc">Descripción</label>
        <textarea id="pDesc" maxlength="500"></textarea>
        <div class="row">
          <div>
            <label for="pPrice">Precio</label>
            <input type="number" id="pPrice" required min="0" step="0.01">
          </div>
          <div>
            <label for="pCat">Categoría</label>
            <select id="pCat" required></select>
          </div>
        </div>
        <label for="pImageFile">Imagen</label>
        <input type="file" id="pImageFile" accept="image/png,image/jpeg,image/webp,image/gif">
        <input type="text" id="pImage" placeholder="…o pega la URL de una imagen" style="margin-top:6px">
        <img class="img-preview" id="pPreview" alt="" hidden>
        <label class="check"><input type="checkbox" id="pActive"> Visible en la tienda</label>
        <label class="check"><input type="checkbox" id="pFeatured"> Destacado</label>
        <p class="error" id="productError"></p>
        <button class="btn btn-block" type="submit">Guardar</button>
      </form>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
