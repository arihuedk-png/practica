<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c1d1e">
  <title>Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="club.css">
  <style>
    .panel { max-width: 960px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .bar .logo { font-size: 2.8rem; margin: 0; text-align: left; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
    .tabs button {
      background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; cursor: pointer;
      color: var(--muted); font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap;
    }
    .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--cream); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .toolbar > .field { flex: 1 1 200px; width: auto; min-width: 0; max-width: 100%; }
    .panel > * { min-width: 0; }
    .toolbar .btn { width: auto; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px; }
    .stat b { display: block; font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat span { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .rows { display: grid; gap: 8px; }
    .item {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
      border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px 14px;
    }
    .item.in { border-color: rgba(143, 199, 154, .45); background: rgba(143, 199, 154, .06); }
    .item-main { min-width: 0; }
    .item-title { font-weight: 600; margin: 0; overflow-wrap: anywhere; }
    .item-sub { color: var(--muted); font-size: .84rem; margin: 2px 0 0; overflow-wrap: anywhere; }
    .item-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; color: var(--text); }
    .chip { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
    .chip.on { color: var(--ok); border-color: rgba(143, 199, 154, .5); }
    .small { width: auto; padding: 8px 12px; font-size: .85rem; }
    .danger { color: var(--bad); border-color: rgba(227, 154, 143, .4); }
    .card { border: 1px solid var(--line-soft); border-radius: 10px; padding: 18px; display: grid; gap: 14px; }
    .card h2 { margin: 0; font-size: 1rem; font-weight: 600; }
    .check { display: flex; gap: 10px; align-items: center; font-size: .92rem; }
    .check input { width: 18px; height: 18px; accent-color: var(--cream); }
    .empty { color: var(--muted); text-align: center; padding: 28px 0; margin: 0; }
    .toast {
      position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      background: var(--cream); color: var(--cream-ink); padding: 10px 16px; border-radius: 6px; font-size: .9rem; z-index: 10;
    }
    textarea.field { min-height: 80px; resize: vertical; }
    @media (max-width: 560px) {
      .item { grid-template-columns: 1fr; }
      .item-actions { justify-content: flex-start; }
      .stats { gap: 6px; }
      .stat { padding: 10px; }
      .stat b { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <!-- Ingreso al panel -->
  <main class="wrap" id="loginView" hidden>
    <section class="column fade-in">
      <h1 class="logo logo-sm" data-club-name></h1>
      <p class="lead">Panel de la lista</p>
      <form id="loginForm" class="column">
        <input class="field" type="password" id="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
        <button class="btn" type="submit">Entrar</button>
        <p class="message" id="loginMessage" role="alert"></p>
      </form>
    </section>
  </main>

  <div class="panel" id="panelView" hidden>
    <header class="bar">
      <h1 class="logo" data-club-name></h1>
      <button class="btn btn-ghost small" id="logoutBtn">Salir</button>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="list" aria-selected="true">Lista</button>
      <button role="tab" data-tab="events" aria-selected="false">Fiestas</button>
      <button role="tab" data-tab="codes" aria-selected="false">Códigos</button>
      <button role="tab" data-tab="settings" aria-selected="false">Ajustes</button>
    </nav>

    <!-- Lista / puerta -->
    <section data-panel="list" class="column" style="max-width:none">
      <div class="toolbar">
        <select class="field" id="listEvent" aria-label="Fiesta"></select>
        <a class="btn btn-ghost small" id="exportBtn" href="#">Exportar CSV</a>
      </div>
      <div class="stats" id="listStats"></div>
      <input class="field" type="search" id="listSearch" placeholder="Buscar por nombre, DNI o código de ingreso" aria-label="Buscar en la lista">
      <div class="rows" id="entries"></div>
    </section>

    <!-- Fiestas -->
    <section data-panel="events" class="column" style="max-width:none" hidden>
      <form class="card" id="eventForm">
        <h2 id="eventFormTitle">Nueva fiesta</h2>
        <div>
          <label class="lbl" for="evName">Nombre</label>
          <input class="field" id="evName" maxlength="80" required>
        </div>
        <div class="row2">
          <div>
            <label class="lbl" for="evDate">Fecha y hora</label>
            <input class="field" id="evDate" type="datetime-local" required>
          </div>
          <div>
            <label class="lbl" for="evCapacity">Cupo (0 = sin límite)</label>
            <input class="field" id="evCapacity" type="number" min="0" value="200">
          </div>
        </div>
        <div>
          <label class="lbl" for="evDesc">Descripción</label>
          <textarea class="field" id="evDesc" maxlength="600" placeholder="Dress code, horario de lista, line up…"></textarea>
        </div>
        <div>
          <label class="lbl" for="evAddress">Dirección (solo la ve quien queda en lista)</label>
          <input class="field" id="evAddress" maxlength="200">
        </div>
        <label class="check"><input type="checkbox" id="evOpen" checked> Lista abierta</label>
        <div class="toolbar">
          <button class="btn small" type="submit">Guardar fiesta</button>
          <button class="btn btn-ghost small" type="button" id="eventCancel" hidden>Cancelar</button>
        </div>
        <p class="message" id="eventMessage"></p>
      </form>
      <div class="rows" id="eventRows"></div>
    </section>

    <!-- Códigos -->
    <section data-panel="codes" class="column" style="max-width:none" hidden>
      <form class="card" id="codeForm">
        <h2 id="codeFormTitle">Nuevo código</h2>
        <div class="row2">
          <div>
            <label class="lbl" for="cdCode">Código</label>
            <input class="field mono" id="cdCode" maxlength="30" required autocapitalize="characters" spellcheck="false">
          </div>
          <div>
            <label class="lbl" for="cdLabel">De quién es</label>
            <input class="field" id="cdLabel" maxlength="60" placeholder="Ej.: RRPP Juli">
          </div>
        </div>
        <div>
          <label class="lbl" for="cdMax">Usos máximos (0 = sin límite)</label>
          <input class="field" id="cdMax" type="number" min="0" value="0">
        </div>
        <label class="check"><input type="checkbox" id="cdActive" checked> Activo</label>
        <div class="toolbar">
          <button class="btn small" type="submit">Guardar código</button>
          <button class="btn btn-ghost small" type="button" id="codeCancel" hidden>Cancelar</button>
        </div>
        <p class="message" id="codeMessage"></p>
      </form>
      <div class="rows" id="codeRows"></div>
    </section>

    <!-- Ajustes -->
    <section data-panel="settings" class="column" style="max-width:none" hidden>
      <form class="card" id="settingsForm">
        <div>
          <label class="lbl" for="stClub">Nombre del lugar</label>
          <input class="field" id="stClub" name="clubName" maxlength="40">
        </div>
        <div>
          <label class="lbl" for="stLine1">Texto de la puerta (línea 1)</label>
          <input class="field" id="stLine1" name="gateLine1" maxlength="140">
        </div>
        <div>
          <label class="lbl" for="stLine2">Texto de la puerta (línea 2)</label>
          <input class="field" id="stLine2" name="gateLine2" maxlength="140">
        </div>
        <div class="row2">
          <div>
            <label class="lbl" for="stFooter">Texto de abajo</label>
            <input class="field" id="stFooter" name="footer" maxlength="140">
          </div>
          <div>
            <label class="lbl" for="stIg">Instagram</label>
            <input class="field" id="stIg" name="instagram" maxlength="40" placeholder="usuario">
          </div>
        </div>
        <div>
          <label class="lbl" for="stAge">Edad mínima</label>
          <input class="field" id="stAge" name="minAge" type="number" min="0" max="99">
        </div>
        <button class="btn small" type="submit">Guardar ajustes</button>
      </form>
    </section>
  </div>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
