<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado del pedido</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner"><a href="/" class="logo" id="logo">Tienda</a></div>
  </header>
  <main style="margin-top:20px; max-width:640px">
    <div class="card" id="orderBox"><p class="muted">Cargando pedido…</p></div>
    <p style="text-align:center; margin-top:16px"><a href="/">← Volver a la tienda</a></p>
  </main>

  <script src="/common.js"></script>
  <script>
    const STEPS = ['pendiente', 'confirmado', 'preparando', 'en_camino', 'entregado'];
    const STEP_LABELS = { pendiente: 'Recibido', confirmado: 'Confirmado', preparando: 'Preparando', en_camino: 'En camino', entregado: 'Entregado' };

    function render(order) {
      const current = STEPS.indexOf(order.status);
      const steps = order.status === 'cancelado'
        ? '<p class="status status-cancelado" style="margin:16px 0">Pedido cancelado</p>'
        : `<div class="steps">${STEPS.map((s, i) => `
            <div class="step ${i <= current ? 'done' : ''}"><i>${i <= current ? '✓' : i + 1}</i>${STEP_LABELS[s]}</div>`).join('')}
          </div>`;
      $('#orderBox').innerHTML = `
        <div class="order-mini-head">
          <h2 style="margin:0">Pedido #${order.id}</h2>
          <span class="status status-${order.status}">${STATUS_LABELS[order.status]}</span>
        </div>
        <p class="muted">${fmtDate(order.createdAt)}</p>
        ${steps}
        <table>
          ${order.items.map((i) => `<tr><td>${i.qty} × ${esc(i.name)}${i.note ? `<br><small class="muted">${esc(i.note)}</small>` : ''}</td><td style="text-align:right">${fmtMoney(i.price * i.qty)}</td></tr>`).join('')}
          ${order.deliveryFee ? `<tr><td>Envío</td><td style="text-align:right">${fmtMoney(order.deliveryFee)}</td></tr>` : ''}
          <tr><td><b>Total</b></td><td style="text-align:right"><b>${fmtMoney(order.total)}</b></td></tr>
        </table>
        <p><b>Entrega:</b> ${order.delivery === 'envio' ? `A domicilio — ${esc(order.customer.address)}` : 'Retiro en el local'}</p>
        <p><b>Pago:</b> ${PAYMENT_LABELS[order.payment]} · <span class="status status-${order.paymentStatus === 'pagado' ? 'pagado' : 'pendiente'}">${order.paymentStatus === 'pagado' ? 'Pagado' : 'Pago pendiente'}</span></p>
        ${order.notes ? `<p><b>Notas:</b> ${esc(order.notes)}</p>` : ''}
        ${order.whatsappUrl ? `<a class="btn btn-wa btn-block" target="_blank" rel="noopener" href="${esc(order.whatsappUrl)}">Consultar por WhatsApp</a>` : ''}
        <p class="muted" style="font-size:.85rem; text-align:center">Esta página se actualiza sola.</p>`;
    }

    async function load() {
      const params = new URLSearchParams(location.search);
      try {
        const { order } = await api(`/api/orders/${encodeURIComponent(params.get('id'))}?t=${encodeURIComponent(params.get('t') || '')}`);
        render(order);
        if (!['entregado', 'cancelado'].includes(order.status)) setTimeout(load, 20000);
      } catch (err) {
        $('#orderBox').innerHTML = `<p class="error">${esc(err.message)}</p>`;
      }
    }

    api('/api/config').then((c) => {
      applyTheme(c.primaryColor);
      $('#logo').textContent = c.storeName;
      document.title = `Estado del pedido · ${c.storeName}`;
    }).catch(() => {});
    load();
  </script>
</body>
</html>
